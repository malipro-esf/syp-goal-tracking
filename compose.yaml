services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-syp}
      POSTGRES_USER: ${POSTGRES_USER:-syp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-development-only}
    ports:
      - "${POSTGRES_PORT:-55432}:5432"
    volumes:
      - syp_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  postgres-test:
    image: postgres:17-alpine
    profiles: ["test"]
    environment:
      POSTGRES_DB: syp_test
      POSTGRES_USER: ${POSTGRES_USER:-syp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-development-only}
    ports:
      - "${POSTGRES_TEST_PORT:-55433}:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 5s
      retries: 15
      start_period: 5s

  migrate:
    profiles: ["app"]
    build:
      context: ./backend
    command: ["alembic", "upgrade", "head"]
    environment:
      SYP_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-syp}:${POSTGRES_PASSWORD:-local-development-only}@postgres:5432/${POSTGRES_DB:-syp}
      SYP_AUTH_SECRET_KEY: ${SYP_AUTH_SECRET_KEY:-local-development-secret-key-change-before-production}
    depends_on:
      postgres:
        condition: service_healthy

  backend:
    profiles: ["app"]
    build:
      context: ./backend
    environment:
      SYP_ENVIRONMENT: ${SYP_ENVIRONMENT:-development}
      SYP_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-syp}:${POSTGRES_PASSWORD:-local-development-only}@postgres:5432/${POSTGRES_DB:-syp}
      SYP_AUTH_SECRET_KEY: ${SYP_AUTH_SECRET_KEY:-local-development-secret-key-change-before-production}
      SYP_LOG_LEVEL: ${SYP_LOG_LEVEL:-INFO}
      SYP_AI_COACH_ENABLED: ${SYP_AI_COACH_ENABLED:-false}
      SYP_OPENAI_API_KEY: ${SYP_OPENAI_API_KEY:-}
      SYP_AI_COACH_MODEL: ${SYP_AI_COACH_MODEL:-gpt-5-mini}
      SYP_AUTOMATIC_PLAN_COMPLETION_ENABLED: ${SYP_AUTOMATIC_PLAN_COMPLETION_ENABLED:-true}
      SYP_AUTOMATIC_PLAN_COMPLETION_INTERVAL_SECONDS: ${SYP_AUTOMATIC_PLAN_COMPLETION_INTERVAL_SECONDS:-300}
      SYP_AUTOMATED_REMINDERS_ENABLED: ${SYP_AUTOMATED_REMINDERS_ENABLED:-true}
      SYP_AUTOMATED_REMINDERS_INTERVAL_SECONDS: ${SYP_AUTOMATED_REMINDERS_INTERVAL_SECONDS:-900}
      SYP_PLAN_ENDING_REMINDER_DAYS: ${SYP_PLAN_ENDING_REMINDER_DAYS:-3}
      SYP_STALE_INVITATION_REMINDER_DAYS: ${SYP_STALE_INVITATION_REMINDER_DAYS:-3}
    ports:
      - "8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully

  frontend:
    profiles: ["app"]
    build:
      context: ./frontend
    ports:
      - "5173:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  syp_postgres_data:
