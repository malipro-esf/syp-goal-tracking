name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: syp_test
          POSTGRES_USER: syp
          POSTGRES_PASSWORD: test-only-password
        ports:
          - 55433:5432
        options: >-
          --health-cmd "pg_isready -U syp -d syp_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      SYP_TEST_DATABASE_URL: postgresql+psycopg://syp:test-only-password@localhost:55433/syp_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install backend
        working-directory: backend
        run: python -m pip install ".[dev,ai]"
      - name: Lint backend
        working-directory: backend
        run: |
          ruff format --check .
          ruff check .
      - name: Test backend
        working-directory: backend
        run: pytest

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend
        working-directory: frontend
        run: npm ci
      - name: Test frontend
        working-directory: frontend
        run: npm test -- --run
      - name: Lint frontend
        working-directory: frontend
        run: npm run lint
      - name: Build frontend
        working-directory: frontend
        run: npm run build

  containers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image
        run: docker build backend
      - name: Build frontend image
        run: docker build frontend
