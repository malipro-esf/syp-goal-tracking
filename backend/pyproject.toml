[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "syp-backend"
version = "0.1.0"
description = "Backend API for SYP"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.140,<0.141",
    "pydantic-settings>=2.10,<3",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.28,<0.29",
    "pytest>=8.4,<9",
    "ruff>=0.12,<0.13",
]

[tool.hatch.build.targets.wheel]
packages = ["src/syp"]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

