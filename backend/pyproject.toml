[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "syp-backend"
version = "0.1.0"
description = "Backend API for SYP"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.19,<2",
    "fastapi[standard]>=0.140,<0.141",
    "pwdlib[argon2]>=0.3,<0.4",
    "pyjwt>=2.13,<3",
    "pydantic-settings>=2.10,<3",
    "psycopg[binary]>=3.3,<4",
    "sqlalchemy>=2.0.51,<2.1",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.28,<0.29",
    "pytest>=8.4,<9",
    "ruff>=0.12,<0.13",
]

[tool.hatch.build.targets.wheel]
packages = ["src/syp"]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
    "integration: requires the isolated PostgreSQL test service",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
